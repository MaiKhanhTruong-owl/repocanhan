<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1450" width="1000" height="1450">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.15" />
    </filter>
    <filter id="glow-gold" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#eab308" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- NỀN TRẮNG SÁCH SẼ -->
  <rect width="1000" height="1450" fill="#ffffff" />
  <rect x="15" y="15" width="970" height="1420" rx="12" fill="#fafafa" stroke="#e2e8f0" stroke-width="2" />

  <!-- TIÊU ĐỀ BẢN VẼ -->
  <text x="500" y="45" fill="#0f172a" font-weight="bold" font-size="20" text-anchor="middle" font-family="sans-serif">SƠ ĐỒ ĐẤU DÂY CHUẨN: ESP32-S3 + DUAL NRF24L01+ PA/LNA</text>
  <text x="500" y="65" fill="#64748b" font-size="12" text-anchor="middle" font-family="sans-serif">(Đã sửa lỗi nguồn 4.2V • Bổ sung AMS1117-3.3V riêng • Khớp chân ESP32-S3 N16R8)</text>

  <!-- 1. TP4056 + SWITCH + PIN (TOP) -->
  <g id="tp4056" transform="translate(180, 80)" filter="url(#shadow)" font-family="sans-serif">
    <rect width="180" height="110" rx="8" fill="#1e40af" stroke="#1d4ed8" stroke-width="2" />
    <rect x="-10" y="38" width="22" height="34" rx="4" fill="#94a3b8" stroke="#475569" stroke-width="1.5" />
    <rect x="-6" y="44" width="14" height="22" rx="2" fill="#334155" />
    <rect x="60" y="35" width="45" height="40" rx="2" fill="#0f172a" />
    <text x="82" y="59" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="monospace">TP4056</text>
    <circle cx="35" cy="35" r="4" fill="#ef4444" />
    <circle cx="35" cy="55" r="4" fill="#3b82f6" />
    <text x="35" y="25" fill="#e2e8f0" font-size="9" text-anchor="middle">CHRG/STDBY</text>
    <text x="90" y="22" fill="#ffffff" font-weight="bold" font-size="13" text-anchor="middle">TP4056 TYPE-C</text>
    
    <circle cx="165" cy="30" r="6" fill="#dc2626" />
    <text x="145" y="34" fill="#ffffff" font-size="11" font-weight="bold">B+</text>
    <circle cx="165" cy="80" r="6" fill="#0f172a" stroke="#ffffff" stroke-width="1" />
    <text x="145" y="84" fill="#ffffff" font-size="11" font-weight="bold">B-</text>
    <circle cx="130" cy="98" r="6" fill="#ea580c" />
    <text x="130" y="88" fill="#f97316" font-size="10" font-weight="bold" text-anchor="middle">OUT+</text>
    <circle cx="50" cy="98" r="6" fill="#0f172a" stroke="#ffffff" stroke-width="1" />
    <text x="50" y="88" fill="#94a3b8" font-size="10" font-weight="bold" text-anchor="middle">OUT-</text>
  </g>

  <!-- Công tắc (Switch) -->
  <g id="switch" transform="translate(470, 95)" filter="url(#shadow)" font-family="sans-serif">
    <rect width="60" height="75" rx="6" fill="#334155" stroke="#1e293b" stroke-width="2" />
    <rect x="10" y="15" width="40" height="45" rx="3" fill="#0f172a" />
    <line x1="20" y1="37" x2="40" y2="37" stroke="#ffffff" stroke-width="3" />
    <circle cx="20" cy="80" r="4" fill="#94a3b8" />
    <circle cx="40" cy="80" r="4" fill="#94a3b8" />
    <text x="30" y="100" fill="#475569" font-size="11" font-weight="bold" text-anchor="middle">Công Tắc</text>
  </g>

  <!-- Pin Li-ion 3.7V -->
  <g id="battery" transform="translate(680, 85)" filter="url(#shadow)" font-family="sans-serif">
    <rect width="180" height="95" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="2" />
    <rect x="160" y="32" width="10" height="30" rx="2" fill="#94a3b8" />
    <text x="90" y="45" fill="#0f172a" font-weight="bold" font-size="15" text-anchor="middle">PIN 3.7V LI-ION</text>
    <text x="90" y="65" fill="#64748b" font-size="12" text-anchor="middle">18650 / Li-Po</text>
    <circle cx="25" cy="30" r="7" fill="#dc2626" />
    <text x="25" y="34" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">+</text>
    <text x="45" y="34" fill="#dc2626" font-size="12" font-weight="bold">Positive</text>

    <circle cx="25" cy="70" r="7" fill="#0f172a" />
    <text x="25" y="73" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">-</text>
    <text x="45" y="74" fill="#334155" font-size="12" font-weight="bold">Negative</text>
  </g>

  <!-- 2. IC ỔN ÁP AMS1117-3.3V -->
  <g id="ams1117" transform="translate(420, 240)" filter="url(#shadow)" font-family="sans-serif">
    <rect width="160" height="100" rx="8" fill="#0284c7" stroke="#0369a1" stroke-width="2" />
    <rect x="45" y="15" width="70" height="40" rx="3" fill="#0f172a" />
    <rect x="60" y="8" width="40" height="10" fill="#94a3b8" />
    <text x="80" y="38" fill="#ffffff" font-size="10" font-weight="bold" text-anchor="middle">AMS1117</text>
    <text x="80" y="50" fill="#38bdf8" font-size="9" text-anchor="middle">3.3V 1A LDO</text>
    <g transform="translate(25, 75)">
      <circle cx="15" cy="15" r="7" fill="#ea580c" />
      <text x="15" y="10" fill="#ffffff" font-size="10" font-weight="bold" text-anchor="middle">VIN</text>
      
      <circle cx="55" cy="15" r="7" fill="#0f172a" stroke="#fff" stroke-width="1" />
      <text x="55" y="10" fill="#ffffff" font-size="10" font-weight="bold" text-anchor="middle">GND</text>
      
      <circle cx="95" cy="15" r="7" fill="#dc2626" />
      <text x="95" y="10" fill="#ffffff" font-size="9" font-weight="bold" text-anchor="middle">3.3V</text>
    </g>
  </g>

  <!-- 3. NRF24L01+ PA/LNA (TRÁI) -->
  <g id="nrf_left" transform="translate(60, 480)" filter="url(#shadow)" font-family="sans-serif">
    <rect width="130" height="520" rx="8" fill="#18181b" stroke="#27272a" stroke-width="2" />
    <g transform="translate(42, -50)">
      <rect width="46" height="60" rx="4" fill="#eab308" stroke="#ca8a04" stroke-width="2" filter="url(#glow-gold)" />
      <circle cx="23" cy="20" r="14" fill="#a16207" />
      <circle cx="23" cy="20" r="6" fill="#fef08a" />
    </g>
    <text x="65" y="45" fill="#facc15" font-weight="bold" font-size="12" text-anchor="middle">NRF24L01+</text>
    <text x="65" y="62" fill="#a1a1aa" font-size="11" text-anchor="middle">PA / LNA (TRÁI)</text>
    
    <rect x="25" y="80" width="80" height="110" rx="4" fill="#27272a" stroke="#3f3f46" />
    <rect x="35" y="210" width="60" height="50" rx="2" fill="#09090b" />
    
    <!-- Tụ lọc 47uF -->
    <g transform="translate(-35, 380)">
      <rect width="26" height="42" rx="4" fill="#475569" stroke="#1e293b" />
      <rect x="0" y="8" width="8" height="34" fill="#cbd5e1" />
      <text x="4" y="28" fill="#0f172a" font-size="9" font-weight="bold">-</text>
      <text x="13" y="-8" fill="#dc2626" font-size="10" font-weight="bold" text-anchor="middle">Tụ 47µF</text>
      <line x1="26" y1="15" x2="55" y2="40" stroke="#dc2626" stroke-width="2" />
      <line x1="26" y1="30" x2="55" y2="60" stroke="#000000" stroke-width="2" />
    </g>

    <!-- Cụm 8 chân 2x4 -->
    <g transform="translate(20, 420)">
      <rect width="90" height="85" rx="4" fill="#09090b" stroke="#3f3f46" stroke-width="1.5" />
      <circle cx="25" cy="20" r="6" fill="#000000" stroke="#fff" stroke-width="1" />
      <text x="25" y="10" fill="#cbd5e1" font-size="9" text-anchor="middle">1:GND</text>
      
      <circle cx="25" cy="40" r="6" fill="#f97316" />
      <text x="5" y="43" fill="#f97316" font-size="9">3:CE</text>
      
      <circle cx="25" cy="60" r="6" fill="#eab308" />
      <text x="5" y="63" fill="#eab308" font-size="9">5:SCK</text>
      
      <circle cx="25" cy="80" r="6" fill="#a855f7" />
      <text x="0" y="83" fill="#a855f7" font-size="9">7:MISO</text>

      <circle cx="65" cy="20" r="6" fill="#dc2626" />
      <text x="65" y="10" fill="#ef4444" font-size="9" text-anchor="middle">2:VCC</text>
      
      <circle cx="65" cy="40" r="6" fill="#2563eb" />
      <text x="75" y="43" fill="#3b82f6" font-size="9">4:CSN</text>
      
      <circle cx="65" cy="60" r="6" fill="#22c55e" />
      <text x="75" y="63" fill="#22c55e" font-size="9">6:MOSI</text>
      
      <circle cx="65" cy="80" r="6" fill="#71717a" />
      <text x="75" y="83" fill="#71717a" font-size="9">8:NC</text>
    </g>
  </g>

  <!-- 4. ESP32-S3 DEVKIT (TRUNG TÂM) -->
  <g id="esp32s3" transform="translate(360, 480)" filter="url(#shadow)" font-family="sans-serif">
    <rect width="280" height="740" rx="12" fill="#09090b" stroke="#27272a" stroke-width="2.5" />
    
    <rect x="40" y="60" width="200" height="180" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2" />
    <text x="140" y="125" fill="#0f172a" font-weight="900" font-size="18" text-anchor="middle">ESPRESSIF</text>
    <text x="140" y="150" fill="#1e293b" font-weight="bold" font-size="15" text-anchor="middle">ESP32-S3-WROOM-1</text>
    <text x="140" y="172" fill="#475569" font-size="12" text-anchor="middle">N16R8 (16MB/8MB)</text>
    <rect x="115" y="190" width="50" height="30" fill="#475569" rx="2" />

    <rect x="105" y="715" width="70" height="35" rx="6" fill="#94a3b8" stroke="#475569" stroke-width="2" />
    <rect x="115" y="725" width="50" height="15" rx="3" fill="#1e293b" />
    <text x="140" y="705" fill="#64748b" font-size="11" text-anchor="middle">USB TYPE-C</text>

    <!-- HÀNG CHÂN TRÁI -->
    <g transform="translate(15, 270)">
      <circle cx="10" cy="20" r="5" fill="#dc2626" />
      <text x="22" y="24" fill="#94a3b8" font-size="11">3V3</text>
      
      <circle cx="10" cy="60" r="6" fill="#f97316" stroke="#fff" stroke-width="1.5" />
      <text x="22" y="64" fill="#f97316" font-weight="bold" font-size="12">G9 (CE 1)</text>

      <circle cx="10" cy="100" r="6" fill="#2563eb" stroke="#fff" stroke-width="1.5" />
      <text x="22" y="104" fill="#3b82f6" font-weight="bold" font-size="12">G10 (CSN 1)</text>

      <circle cx="10" cy="140" r="6" fill="#22c55e" stroke="#fff" stroke-width="1.5" />
      <text x="22" y="144" fill="#22c55e" font-weight="bold" font-size="12">G11 (MOSI)</text>

      <circle cx="10" cy="180" r="6" fill="#eab308" stroke="#fff" stroke-width="1.5" />
      <text x="22" y="184" fill="#eab308" font-weight="bold" font-size="12">G12 (SCK)</text>

      <circle cx="10" cy="220" r="6" fill="#a855f7" stroke="#fff" stroke-width="1.5" />
      <text x="22" y="224" fill="#a855f7" font-weight="bold" font-size="12">G13 (MISO)</text>

      <circle cx="10" cy="300" r="6" fill="#ea580c" stroke="#fff" stroke-width="1.5" />
      <text x="22" y="304" fill="#f97316" font-weight="bold" font-size="12">5V (VIN)</text>

      <circle cx="10" cy="340" r="6" fill="#000000" stroke="#fff" stroke-width="1.5" />
      <text x="22" y="344" fill="#cbd5e1" font-weight="bold" font-size="12">GND</text>
    </g>

    <!-- HÀNG CHÂN PHẢI -->
    <g transform="translate(265, 270)">
      <circle cx="-10" cy="20" r="5" fill="#000000" stroke="#fff" stroke-width="1" />
      <text x="-22" y="24" fill="#cbd5e1" font-size="11" text-anchor="end">GND</text>

      <circle cx="-10" cy="60" r="6" fill="#14b8a6" stroke="#fff" stroke-width="1.5" />
      <text x="-22" y="64" fill="#14b8a6" font-weight="bold" font-size="12" text-anchor="end">(CE 2) G21</text>

      <circle cx="-10" cy="100" r="6" fill="#ec4899" stroke="#fff" stroke-width="1.5" />
      <text x="-22" y="104" fill="#ec4899" font-weight="bold" font-size="12" text-anchor="end">(CSN 2) G14</text>

      <!-- VÙNG CẤM PSRAM -->
      <g transform="translate(-160, 150)">
        <rect width="150" height="70" rx="4" fill="#450a0a" stroke="#dc2626" stroke-width="1" />
        <text x="75" y="22" fill="#f87171" font-size="10" font-weight="bold" text-anchor="middle">⚠️ KHÔNG CẮM DÂY:</text>
        <text x="75" y="40" fill="#fca5a5" font-size="10" text-anchor="middle">GPIO 33, 34, 35, 36, 37</text>
        <text x="75" y="58" fill="#f87171" font-size="9" text-anchor="middle">(Bộ nhớ Octal PSRAM)</text>
      </g>
    </g>
  </g>

  <!-- 5. NRF24L01+ PA/LNA (PHẢI) -->
  <g id="nrf_right" transform="translate(810, 480)" filter="url(#shadow)" font-family="sans-serif">
    <rect width="130" height="520" rx="8" fill="#18181b" stroke="#27272a" stroke-width="2" />
    <g transform="translate(42, -50)">
      <rect width="46" height="60" rx="4" fill="#eab308" stroke="#ca8a04" stroke-width="2" filter="url(#glow-gold)" />
      <circle cx="23" cy="20" r="14" fill="#a16207" />
      <circle cx="23" cy="20" r="6" fill="#fef08a" />
    </g>
    <text x="65" y="45" fill="#facc15" font-weight="bold" font-size="12" text-anchor="middle">NRF24L01+</text>
    <text x="65" y="62" fill="#a1a1aa" font-size="11" text-anchor="middle">PA / LNA (PHẢI)</text>
    
    <rect x="25" y="80" width="80" height="110" rx="4" fill="#27272a" stroke="#3f3f46" />
    <rect x="35" y="210" width="60" height="50" rx="2" fill="#09090b" />
    
    <g transform="translate(140, 380)">
      <rect width="26" height="42" rx="4" fill="#475569" stroke="#1e293b" />
      <rect x="0" y="8" width="8" height="34" fill="#cbd5e1" />
      <text x="4" y="28" fill="#0f172a" font-size="9" font-weight="bold">-</text>
      <text x="13" y="-8" fill="#dc2626" font-size="10" font-weight="bold" text-anchor="middle">Tụ 47µF</text>
      <line x1="0" y1="15" x2="-35" y2="40" stroke="#dc2626" stroke-width="2" />
      <line x1="0" y1="30" x2="-75" y2="40" stroke="#000000" stroke-width="2" />
    </g>

    <g transform="translate(20, 420)">
      <rect width="90" height="85" rx="4" fill="#09090b" stroke="#3f3f46" stroke-width="1.5" />
      <circle cx="25" cy="20" r="6" fill="#000000" stroke="#fff" stroke-width="1" />
      <text x="25" y="10" fill="#cbd5e1" font-size="9" text-anchor="middle">1:GND</text>
      
      <circle cx="25" cy="40" r="6" fill="#14b8a6" />
      <text x="5" y="43" fill="#14b8a6" font-size="9">3:CE</text>
      
      <circle cx="25" cy="60" r="6" fill="#eab308" />
      <text x="5" y="63" fill="#eab308" font-size="9">5:SCK</text>
      
      <circle cx="25" cy="80" r="6" fill="#a855f7" />
      <text x="0" y="83" fill="#a855f7" font-size="9">7:MISO</text>

      <circle cx="65" cy="20" r="6" fill="#dc2626" />
      <text x="65" y="10" fill="#ef4444" font-size="9" text-anchor="middle">2:VCC</text>
      
      <circle cx="65" cy="40" r="6" fill="#ec4899" />
      <text x="75" y="43" fill="#ec4899" font-size="9">4:CSN</text>
      
      <circle cx="65" cy="60" r="6" fill="#22c55e" />
      <text x="75" y="63" fill="#22c55e" font-size="9">6:MOSI</text>
      
      <circle cx="65" cy="80" r="6" fill="#71717a" />
      <text x="75" y="83" fill="#71717a" font-size="9">8:NC</text>
    </g>
  </g>

  <!-- 6. ĐƯỜNG DÂY NỐI -->
  <!-- Pin (+) -> Switch chân 1 -->
  <path d="M 705 115 L 510 115 L 510 175" fill="none" stroke="#dc2626" stroke-width="3" stroke-linecap="round" />
  <!-- Switch chân 2 -> TP4056 B+ -->
  <path d="M 490 175 L 490 110 L 345 110" fill="none" stroke="#dc2626" stroke-width="3" stroke-linecap="round" />
  <!-- Pin (-) -> TP4056 B- -->
  <path d="M 705 155 L 345 155 L 345 160" fill="none" stroke="#000000" stroke-width="3.5" stroke-linecap="round" />

  <!-- TP4056 OUT+ -> AMS1117 VIN -->
  <path d="M 310 180 L 310 210 L 440 210 L 440 330" fill="none" stroke="#ea580c" stroke-width="3.5" stroke-linecap="round" />
  <!-- Nguồn 5V phụ cho ESP32 -->
  <path d="M 310 210 L 325 210 L 325 780 L 370 780" fill="none" stroke="#ea580c" stroke-width="2.5" stroke-dasharray="6,4" stroke-linecap="round" />

  <!-- GND CHUNG -->
  <path d="M 230 180 L 230 225 L 475 225 L 475 330" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round" />
  <path d="M 230 225 L 20 225 L 20 820 L 370 820" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round" />
  <path d="M 20 440 L 105 440 L 105 460" fill="none" stroke="#000000" stroke-width="3.5" stroke-linecap="round" />
  <path d="M 475 225 L 970 225 L 970 440 L 855 440 L 855 460" fill="none" stroke="#000000" stroke-width="3.5" stroke-linecap="round" />

  <!-- 3.3V SẠCH CHO NRF -->
  <path d="M 515 330 L 515 390 L 145 390 L 145 460" fill="none" stroke="#dc2626" stroke-width="3.5" stroke-linecap="round" />
  <path d="M 515 390 L 895 390 L 895 460" fill="none" stroke="#dc2626" stroke-width="3.5" stroke-linecap="round" />

  <!-- SPI CHUNG -->
  <!-- SCK -->
  <path d="M 370 660 L 320 660 L 320 1020 L 105 1020 L 105 560" fill="none" stroke="#eab308" stroke-width="3" stroke-linecap="round" />
  <path d="M 320 1020 L 750 1020 L 750 560 L 855 560" fill="none" stroke="#eab308" stroke-width="3" stroke-linecap="round" />
  <circle cx="320" cy="1020" r="4" fill="#eab308" />

  <!-- MOSI -->
  <path d="M 370 620 L 300 620 L 300 1040 L 145 1040 L 145 560" fill="none" stroke="#22c55e" stroke-width="3" stroke-linecap="round" />
  <path d="M 300 1040 L 770 1040 L 770 560 L 895 560" fill="none" stroke="#22c55e" stroke-width="3" stroke-linecap="round" />
  <circle cx="300" cy="1040" r="4" fill="#22c55e" />

  <!-- MISO -->
  <path d="M 370 700 L 280 700 L 280 1060 L 105 1060 L 105 580" fill="none" stroke="#a855f7" stroke-width="3" stroke-linecap="round" />
  <path d="M 280 1060 L 790 1060 L 790 580 L 855 580" fill="none" stroke="#a855f7" stroke-width="3" stroke-linecap="round" />
  <circle cx="280" cy="1060" r="4" fill="#a855f7" />

  <!-- CE & CSN RIÊNG -->
  <!-- Left -->
  <path d="M 370 330 L 240 330 L 240 520 L 105 520 L 105 500" fill="none" stroke="#f97316" stroke-width="3" stroke-linecap="round" />
  <path d="M 370 370 L 220 370 L 220 540 L 145 540 L 145 500" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" />

  <!-- Right -->
  <path d="M 630 330 L 760 330 L 760 520 L 855 520 L 855 500" fill="none" stroke="#14b8a6" stroke-width="3" stroke-linecap="round" />
  <path d="M 630 370 L 780 370 L 780 540 L 895 540 L 895 500" fill="none" stroke="#ec4899" stroke-width="3" stroke-linecap="round" />

  <!-- 7. BẢNG MÃ MÀU FOOTER -->
  <g transform="translate(50, 1260)" font-family="sans-serif">
    <rect width="900" height="150" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <text x="20" y="30" fill="#0f172a" font-weight="bold" font-size="14">BẢNG TRA CỨU MÀU DÂY THI CÔNG NHANH:</text>
    
    <g transform="translate(20, 50)">
      <line x1="0" y1="10" x2="30" y2="10" stroke="#dc2626" stroke-width="4" />
      <text x="40" y="14" fill="#1e293b" font-size="12">🔴 3.3V (VCC): Ra từ AMS1117 -> Chân 2 NRF Trái &amp; Phải</text>

      <line x1="0" y1="35" x2="30" y2="35" stroke="#000000" stroke-width="4" />
      <text x="40" y="39" fill="#1e293b" font-size="12">⚫ GND (Mass): Nối chung TP4056, AMS1117, ESP32, 2x NRF</text>

      <line x1="0" y1="60" x2="30" y2="60" stroke="#eab308" stroke-width="4" />
      <text x="40" y="64" fill="#1e293b" font-size="12">🟡 SCK (Clock): ESP32-S3 GPIO 12 -> Chân 5 NRF Trái &amp; Phải</text>
    </g>

    <g transform="translate(480, 50)">
      <line x1="0" y1="10" x2="30" y2="10" stroke="#22c55e" stroke-width="4" />
      <text x="40" y="14" fill="#1e293b" font-size="12">🟢 MOSI: ESP32-S3 GPIO 11 -> Chân 6 NRF Trái &amp; Phải</text>

      <line x1="0" y1="35" x2="30" y2="35" stroke="#a855f7" stroke-width="4" />
      <text x="40" y="39" fill="#1e293b" font-size="12">🟣 MISO: ESP32-S3 GPIO 13 -> Chân 7 NRF Trái &amp; Phải</text>

      <line x1="0" y1="60" x2="30" y2="60" stroke="#f97316" stroke-width="4" />
